<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{--night:#0a0d16;--slate:#161c2b;--brass:#c9a668;--paper:#eef1f6;--muted:#8a93ab;}
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--night);color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px 16px 48px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  h1{font-size:1.5rem;margin:0 0 20px;}
  section{
    background:var(--slate);border:1px solid #ffffff14;border-radius:12px;
    padding:16px;margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  input{
    width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff2a;
    background:#0000003a;color:var(--paper);font-size:15px;margin-bottom:10px;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  button{
    flex:1;min-width:120px;padding:12px;border:none;border-radius:8px;
    font-weight:700;font-size:14px;cursor:pointer;background:var(--brass);color:var(--night);
  }
  button.danger{background:#c0392b;color:var(--paper);}
  button.secondary{background:#2a3245;color:var(--paper);}
  pre{
    background:#00000055;padding:12px;border-radius:8px;overflow-x:auto;
    font-size:12px;color:var(--muted);
  }
  #log{white-space:pre-wrap;font-size:12px;color:var(--muted);margin-top:8px;}
  .section-title{font-size:15px;margin:0 0 8px;color:var(--paper);}
  .hint{font-size:12px;color:var(--muted);margin:0 0 12px;}
  code{background:#0000003a;padding:1px 5px;border-radius:4px;font-size:11px;}
  button.debug{background:#2a3245;color:var(--paper);flex:0 1 auto;min-width:0;padding:10px 14px;font-size:13px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Green Building Race — Admin</h1>

    <section>
      <label for="key">Admin key</label>
      <input id="key" type="password" placeholder="admin key" autocomplete="off">
      <div class="row">
        <button id="save-key" class="secondary">Save key (this device)</button>
      </div>
    </section>

    <section>
      <div class="row">
        <button id="start">Start race</button>
        <button id="stop" class="secondary">Stop / pause</button>
        <button id="reset" class="danger">Reset</button>
      </div>
    </section>

    <section>
      <label for="intro-seconds">Intro — the king leaves, then each mascot is introduced (14–45 s)</label>
      <input id="intro-seconds" type="number" min="14" max="45" step="0.5">
      <label for="countdown-seconds">Countdown before cheering opens (0–10 s)</label>
      <input id="countdown-seconds" type="number" min="0" max="10" step="1">
      <div class="row">
        <button id="save-config" class="secondary">Save timing (applies to the next start)</button>
      </div>
    </section>

    <section>
      <label for="brightness">Max brightness — caps every window, everywhere, immediately (40%–100%)</label>
      <input id="brightness" type="range" min="40" max="100" step="5">
      <div class="row">
        <span id="brightness-value" style="flex:none;color:var(--muted);font-size:13px;padding:12px 0;"></span>
        <button id="save-brightness" class="secondary">Apply now</button>
      </div>
    </section>

    <section>
      <div class="row">
        <button id="rotate" class="secondary">Mint fresh sim instance</button>
      </div>
      <div id="log"></div>
    </section>

    <section>
      <h2 class="section-title">Debug — preview on the building</h2>
      <p class="hint">Pushes straight to the sim/building through the same flash guard as everything
        else. Requires the race to be idle (not mid-intro/countdown/race) — Stop or Reset first.</p>
      <label>Mascots (idle pose, centred)</label>
      <div class="row" id="mascot-preview-row"></div>
      <label style="margin-top:12px;">Mascots at 5x5 (small debug art)</label>
      <div class="row" id="mascot5-preview-row"></div>
      <label style="margin-top:12px;">Living-field scenes (ported from the <code>living-field</code> branch)</label>
      <div class="row" id="scene-preview-row"></div>
    </section>

    <section>
      <label>Live state</label>
      <pre id="state">loading&hellip;</pre>
    </section>
  </div>

<script src="config.js"></script>
<script>
  const keyInput = document.getElementById("key");
  keyInput.value = sessionStorage.getItem("adminKey") ?? "";

  document.getElementById("save-key").addEventListener("click", () => {
    sessionStorage.setItem("adminKey", keyInput.value);
    log("Key saved for this browser tab session.");
  });

  function log(msg) {
    document.getElementById("log").textContent = msg;
  }

  async function adminPost(path, body) {
    const key = sessionStorage.getItem("adminKey") ?? keyInput.value;
    const resp = await fetch(`${API_BASE}${path}`, {
      method: "POST",
      headers: { "X-Admin-Key": key, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) log(`Error: ${data.error ?? resp.status}`);
    else log(`OK: ${path}`);
    return data;
  }

  document.getElementById("start").addEventListener("click", () => adminPost("/api/admin/start"));
  document.getElementById("stop").addEventListener("click", () => adminPost("/api/admin/stop"));
  document.getElementById("reset").addEventListener("click", () => {
    if (confirm("Reset the race? This clears all cheers and gives the crown back to the Duck King.")) adminPost("/api/admin/reset");
  });
  const introInput = document.getElementById("intro-seconds");
  const countdownInput = document.getElementById("countdown-seconds");
  document.getElementById("save-config").addEventListener("click", () =>
    adminPost("/api/admin/config", {
      introSeconds: Number(introInput.value),
      countdownSeconds: Number(countdownInput.value),
    }),
  );

  const brightnessInput = document.getElementById("brightness");
  const brightnessValue = document.getElementById("brightness-value");
  brightnessInput.addEventListener("input", () => {
    brightnessValue.textContent = `${brightnessInput.value}%`;
  });
  document.getElementById("save-brightness").addEventListener("click", () =>
    adminPost("/api/admin/config", { brightness: Number(brightnessInput.value) / 100 }),
  );

  document.getElementById("rotate").addEventListener("click", async () => {
    const data = await adminPost("/api/admin/rotate-instance");
    if (data.view_url) log(`New instance: ${data.name}\nView: ${data.view_url}`);
  });

  // Debug — preview on the building. Mirrors src/sprites.js's MASCOTS keys and
  // src/living-field-scenes.js's LIVING_FIELD_SCENES keys; kept in sync by hand since the
  // admin page has no build step to import them from.
  const MASCOT_PREVIEWS = [
    { id: "beaver", label: "Tim the Beaver (MIT)" },
    { id: "pilgrim", label: "John Harvard" },
    { id: "terrier", label: "Rhett the Terrier (BU)" },
    { id: "husky", label: "Paws the Husky (NEU)" },
    { id: "duck", label: "The Duck King" },
  ];
  const SCENE_PREVIEWS = [
    { id: "finale", label: "Finale (fireworks)" },
    { id: "aurora", label: "Aurora" },
    { id: "seismic", label: "Seismic" },
    { id: "radar", label: "Radar" },
    { id: "sounding", label: "Sounding" },
    { id: "attention", label: "Attention" },
    { id: "startle", label: "Startle" },
    { id: "memory", label: "Memory" },
    { id: "dream", label: "Dream" },
    { id: "forecast", label: "Forecast" },
    { id: "scroll-mit", label: "Scroll: MIT" },
    { id: "scroll-harvard", label: "Scroll: Harvard" },
    { id: "scroll-bu", label: "Scroll: BU" },
    { id: "scroll-neu", label: "Scroll: Northeastern" },
  ];

  function addPreviewButton(row, label, onClick) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "debug";
    btn.textContent = label;
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        await onClick();
      } finally {
        btn.disabled = false;
      }
    });
    row.appendChild(btn);
  }

  const mascotRow = document.getElementById("mascot-preview-row");
  for (const { id, label } of MASCOT_PREVIEWS) {
    addPreviewButton(mascotRow, label, async () => {
      const data = await adminPost("/api/admin/preview/mascot", { id });
      if (data.ok === false) log(`${label}: ${data.reason}`);
      else if (data.ok) log(`${label}: pushed to the building.`);
    });
  }

  const mascot5Row = document.getElementById("mascot5-preview-row");
  for (const { id, label } of MASCOT_PREVIEWS) {
    addPreviewButton(mascot5Row, `${label} (5x5)`, async () => {
      const data = await adminPost("/api/admin/preview/mascot", { id, size: 5 });
      if (data.ok === false) log(`${label} (5x5): ${data.reason}`);
      else if (data.ok) log(`${label} (5x5): pushed to the building.`);
    });
  }

  const sceneRow = document.getElementById("scene-preview-row");
  for (const { id, label } of SCENE_PREVIEWS) {
    addPreviewButton(sceneRow, label, async () => {
      log(`${label}: streaming…`);
      const data = await adminPost("/api/admin/preview/scene", { scene: id });
      if (data.ok === false) log(`${label}: ${data.reason}`);
      else if (data.ok) log(`${label}: played (${data.seconds ?? "?"}s).`);
    });
  }

  async function poll() {
    try {
      const resp = await fetch(`${API_BASE}/api/state`);
      const state = await resp.json();
      document.getElementById("state").textContent = JSON.stringify(state, null, 2);
      // show the saved timing, without overwriting a field the host is editing
      if (state.config && document.activeElement !== introInput) introInput.value = state.config.introSeconds;
      if (state.config && document.activeElement !== countdownInput) countdownInput.value = state.config.countdownSeconds;
      if (state.config?.brightness && document.activeElement !== brightnessInput) {
        const pct = Math.round(state.config.brightness * 100);
        brightnessInput.value = pct;
        brightnessValue.textContent = `${pct}%`;
      }
    } catch {
      document.getElementById("state").textContent = "Can't reach the race server.";
    }
  }
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
